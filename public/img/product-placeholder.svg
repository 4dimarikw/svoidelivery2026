<!--
  Статическая заглушка для товаров без изображения — используется там, где
  недоступен Blade (config('project.default_beer_label'), MoonShine
  Image::make('thumb') на ProductDetailPage). Нейтральная коробка — тот же
  силуэт, что в @default-ветке resources/views/components/ui/
  product-placeholder.blade.php, для товара без определённой тары.
  Цвета — литералы, потому что это отдельный ассет вне сборки Tailwind:
  #FAF6EC = cream-100 (фон), #D8C9A4 = cream-300 (заливка), #998A77 = ink-300 (контур).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Изображение товара отсутствует">
    <rect x="0" y="0" width="96" height="96" fill="#FAF6EC" />
    <g fill="#D8C9A4" stroke="#998A77" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="26" y="32" width="44" height="40" rx="4" />
        <line x1="26" y1="48" x2="70" y2="48" stroke-width="1.25" />
        <line x1="48" y1="32" x2="48" y2="72" stroke-width="1.25" />
    </g>
</svg>
